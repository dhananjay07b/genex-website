# Requests for any hostname that isn't one of ours (bots scanning the IP address,
# a stray DNS record) are dropped instead of being answered by one of the sites.

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
