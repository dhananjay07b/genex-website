# SEO_MODE=hidden (the test sites): open to anyone with the link, but kept out of
# search results. Server level, like the other headers: locations here set caching
# with `expires`, never add_header, so this header reaches every response.
add_header X-Robots-Tag "noindex, nofollow" always;

location = /robots.txt {
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
}

location = /sitemap.xml {
    return 404;
}
