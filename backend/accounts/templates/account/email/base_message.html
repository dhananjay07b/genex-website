{% autoescape on %}<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GeLearn</title></head>
<body style="margin:0;padding:0;background:#f1f5f9;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f1f5f9;padding:32px 12px;">
  <tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:12px;border:1px solid #e2e8f0;font-family:Arial,Helvetica,sans-serif;color:#0f172a;">
      <tr><td style="padding:24px 32px;border-bottom:1px solid #e2e8f0;">
        <span style="font-size:22px;font-weight:bold;color:#0d1117;">Ge</span><span style="font-size:22px;font-weight:bold;color:#00b894;">Learn</span>
        <span style="font-size:12px;color:#64748b;"> &nbsp;by Genex Technocrats</span>
      </td></tr>
      <tr><td style="padding:28px 32px 8px;font-size:15px;line-height:1.6;">
        <p style="margin:0 0 16px;">Hello{% if user.display_name %} {{ user.display_name }}{% endif %},</p>
        {% block content %}{% endblock content %}
      </td></tr>
      <tr><td style="padding:16px 32px 28px;font-size:13px;line-height:1.6;color:#64748b;">
        The GeLearn team at Genex Technocrats<br>
        <a href="{{ gelearn_url }}" style="color:#0284c7;">{{ gelearn_url }}</a>
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>{% endautoescape %}
