{# The site's primary button: brand gradient, white text. Clients without gradients (Outlook) show the solid colour. #}
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:8px 0 20px;"><tr><td bgcolor="#1aaee8" style="border-radius:8px;background:#1aaee8;background-image:linear-gradient(90deg,#1aaee8 0%,#00c5b0 50%,#00d97e 100%);">
  <a href="{{ link }}" style="display:inline-block;padding:13px 28px;font-size:15px;font-weight:bold;color:#ffffff;text-decoration:none;border-radius:8px;">{{ label }}</a>
</td></tr></table>
<p style="margin:0 0 16px;font-size:13px;color:#64748b;">Or copy this link into your browser:<br><a href="{{ link }}" style="color:#0b8bc4;word-break:break-all;">{{ link }}</a></p>
