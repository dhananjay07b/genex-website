# Backend — cms.genextechnocrats.com
# Reverse-proxies to gunicorn (see deploy/gunicorn/genex-backend.service),
# which runs the Django/Wagtail app on 127.0.0.1:8000. Static and media files
# are served directly by Apache for performance, bypassing gunicorn.

<VirtualHost *:80>
    ServerName cms.genextechnocrats.com
    Redirect permanent / https://cms.genextechnocrats.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName cms.genextechnocrats.com

    # Collected via `python manage.py collectstatic` — matches STATIC_ROOT/MEDIA_ROOT
    # in backend/genex/settings/base.py.
    Alias /static/ /var/www/genex/backend/staticfiles/
    Alias /media/  /var/www/genex/backend/media/

    <Directory /var/www/genex/backend/staticfiles>
        Require all granted
    </Directory>
    <Directory /var/www/genex/backend/media>
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyPass        /static/ !
    ProxyPass        /media/  !
    ProxyPass        / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    RequestHeader set X-Forwarded-Proto "https"

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/cms.genextechnocrats.com/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/cms.genextechnocrats.com/privkey.pem

    ErrorLog  ${APACHE_LOG_DIR}/cms.genextechnocrats.com-error.log
    CustomLog ${APACHE_LOG_DIR}/cms.genextechnocrats.com-access.log combined
</VirtualHost>
