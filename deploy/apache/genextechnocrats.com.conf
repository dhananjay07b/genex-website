# Marketing site — genextechnocrats.com
# Serves the built frontend SPA. Update DocumentRoot to wherever `npm run build`
# output (frontend/dist) is copied on this server.

<VirtualHost *:80>
    ServerName genextechnocrats.com
    ServerAlias www.genextechnocrats.com
    Redirect permanent / https://genextechnocrats.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName genextechnocrats.com
    ServerAlias www.genextechnocrats.com

    DocumentRoot /var/www/genex/frontend/dist

    <Directory /var/www/genex/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # SPA fallback: any path that isn't a real file (e.g. /portfolio, /about/faq)
    # is served index.html so react-router can take over client-side.
    RewriteEngine On
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ /index.html [L]

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/genextechnocrats.com/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/genextechnocrats.com/privkey.pem

    ErrorLog  ${APACHE_LOG_DIR}/genextechnocrats.com-error.log
    CustomLog ${APACHE_LOG_DIR}/genextechnocrats.com-access.log combined
</VirtualHost>
