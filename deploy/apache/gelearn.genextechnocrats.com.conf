# GeLearn — gelearn.genextechnocrats.com
# Serves the SAME built frontend as genextechnocrats.com.conf (same DocumentRoot,
# same files) — this is one build, not a separate deploy. isGeLearnHost() in the
# app picks the GeLearn shell purely because it sees this hostname at runtime.
#
# The only thing this vhost does differently is swap /sitemap.xml and
# /robots.txt for the GeLearn-specific versions, mirroring the host-based
# rewrite already used on the temporary Vercel deployment (frontend/vercel.json).

<VirtualHost *:80>
    ServerName gelearn.genextechnocrats.com
    Redirect permanent / https://gelearn.genextechnocrats.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName gelearn.genextechnocrats.com

    DocumentRoot /var/www/genex/frontend/dist

    <Directory /var/www/genex/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On

    # GeLearn-specific SEO files, generated into frontend/dist alongside the
    # marketing ones during the frontend build. Must come before the SPA
    # fallback below so these two paths don't just serve index.html.
    RewriteRule ^/sitemap\.xml$ /gelearn-sitemap.xml [L]
    RewriteRule ^/robots\.txt$  /gelearn-robots.txt [L]

    # SPA fallback — same as the marketing vhost.
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ /index.html [L]

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/gelearn.genextechnocrats.com/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/gelearn.genextechnocrats.com/privkey.pem

    ErrorLog  ${APACHE_LOG_DIR}/gelearn.genextechnocrats.com-error.log
    CustomLog ${APACHE_LOG_DIR}/gelearn.genextechnocrats.com-access.log combined
</VirtualHost>
