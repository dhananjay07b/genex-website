# Security headers for the two frontend sites (genextechnocrats.com and gelearn.).
# Copy to /etc/nginx/snippets/. Included at server level: a location that sets its
# own add_header would drop these, so locations set caching with `expires` instead.

# HTTPS only, remembered for a year. includeSubDomains stays off until every
# *.genextechnocrats.com host serves HTTPS (it's hard to undo), as in production.py.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# Where the pages may load things from. Report-only for now: browsers log what it
# would block (DevTools console) but block nothing. Once a few weeks show no
# legitimate violations, rename the header to Content-Security-Policy to enforce it.
# - script sha256: the Google Analytics snippet in frontend/index.html; if that
#   snippet changes, update the hash (the console reports the new one).
# - cms.genextechnocrats.com: the API and CMS uploads.
# - analytics.google.com, stats.g.doubleclick.net: where Google Analytics sends page views.
# - img-src https: images in CMS rich text may come from any HTTPS site.
# - media-src https: videos and podcast audio can be hosted elsewhere.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-eqGH7l6LEDj3/cAd7oDUIJdo41YSC8meutUR1/XqyRs=' https://www.googletagmanager.com https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' https:; connect-src 'self' https://cms.genextechnocrats.com https://*.google-analytics.com https://analytics.google.com https://*.analytics.google.com https://stats.g.doubleclick.net https://www.googletagmanager.com https://accounts.google.com/gsi/; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
