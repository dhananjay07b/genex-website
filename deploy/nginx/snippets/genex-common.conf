# Included in every Genex HTTPS server block (server context).
# Copy to /etc/nginx/snippets/. Kept out of the http block on purpose: Ubuntu's
# nginx.conf already sets some of these there, and repeating them errors.

server_tokens off;

# TLS: the certificate paths are per site; these settings are shared.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:GenexSSL:10m;
ssl_session_timeout 1d;

# Compress text responses (JS, CSS, HTML, JSON from the API, SVG). Images and
# video are already compressed. Ubuntu's nginx.conf turns gzip on but only for HTML.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/xml application/json application/javascript
           text/javascript application/manifest+json image/svg+xml;
