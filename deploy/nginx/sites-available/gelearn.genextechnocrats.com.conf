# GeLearn: gelearn.genextechnocrats.com.
# The SAME built frontend as the marketing site (one build, not two): the app shows
# the GeLearn shell because of this hostname (frontend/src/lib/host.ts). This site
# only differs in its sitemap/robots files and a few renamed-section redirects.

server {
    listen 80;
    listen [::]:80;
    server_name gelearn.genextechnocrats.com;
    return 301 https://gelearn.genextechnocrats.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gelearn.genextechnocrats.com;

    ssl_certificate     /etc/letsencrypt/live/gelearn.genextechnocrats.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gelearn.genextechnocrats.com/privkey.pem;
    include snippets/genex-common.conf;
    include snippets/genex-frontend-headers.conf;

    # GeLearn's own SEO files, built into frontend/dist next to the marketing ones.
    location = /sitemap.xml { try_files /gelearn-sitemap.xml =404; }
    location = /robots.txt  { try_files /gelearn-robots.txt =404; }

    # Renamed sections (2026-09-29): permanent redirects keep old links and search
    # rankings. The app's router redirects these too, as a fallback.
    location ~ ^/technology(/.*)?$   { return 301 /geacademy$1$is_args$args; }
    location ~ ^/case-studies(/.*)?$ { return 301 /research$1$is_args$args; }
    location ~ ^/tenders/?$          { return 301 /policies-tenders$is_args$args; }

    include snippets/genex-frontend-files.conf;

    access_log /var/log/nginx/gelearn.genextechnocrats.com-access.log;
    error_log  /var/log/nginx/gelearn.genextechnocrats.com-error.log;
}
