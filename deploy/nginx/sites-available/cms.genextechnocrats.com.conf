# Backend: cms.genextechnocrats.com (the API, Wagtail CMS and Django admin).
# Proxies to gunicorn on 127.0.0.1:8000 (deploy/gunicorn/genex-backend.service).
# Static and media files are served by Nginx directly, without going through Django.

server {
    listen 80;
    listen [::]:80;
    server_name cms.genextechnocrats.com;
    return 301 https://cms.genextechnocrats.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cms.genextechnocrats.com;

    ssl_certificate     /etc/letsencrypt/live/cms.genextechnocrats.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cms.genextechnocrats.com/privkey.pem;
    include snippets/genex-common.conf;

    # Uploads: documents are capped at 25 MB by the app; a little headroom here.
    client_max_body_size 30m;

    # `python manage.py collectstatic` output (STATIC_ROOT in genex/settings/base.py):
    # the CMS and admin's own CSS/JS. Their names don't change between versions,
    # so a day's cache.
    location /static/ {
        alias /var/www/genex/backend/staticfiles/;
        expires 1d;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Uploaded images, resized copies and documents (MEDIA_ROOT). A changed upload
    # gets a new file name, so these can be cached for a month. nosniff: a browser
    # must never treat an uploaded file as anything but its declared type.
    location /media/ {
        alias /var/www/genex/backend/media/;
        expires 30d;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Everything else is Django. It sets its own security headers (HSTS, nosniff,
    # frame and referrer rules) on these responses, so none are added here.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        # Django reads the visitor's IP from the last entry (NUM_PROXIES=1 in .env)
        # and HTTPS from X-Forwarded-Proto (SECURE_PROXY_SSL_HEADER in production.py).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
        # Certificate PDFs and images are drawn on request; allow time for a slow one.
        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/cms.genextechnocrats.com-access.log;
    error_log  /var/log/nginx/cms.genextechnocrats.com-error.log;
}
