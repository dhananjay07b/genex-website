# Marketing site: genextechnocrats.com (www redirects here).
# Copy to /etc/nginx/sites-available/ and link into sites-enabled (deploy/README.md).

server {
    listen 80;
    listen [::]:80;
    server_name genextechnocrats.com www.genextechnocrats.com;
    return 301 https://genextechnocrats.com$request_uri;
}

# One address for the site: www is a permanent redirect, not a second copy.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.genextechnocrats.com;

    ssl_certificate     /etc/letsencrypt/live/genextechnocrats.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/genextechnocrats.com/privkey.pem;
    include snippets/genex-common.conf;

    return 301 https://genextechnocrats.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name genextechnocrats.com;

    ssl_certificate     /etc/letsencrypt/live/genextechnocrats.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/genextechnocrats.com/privkey.pem;
    include snippets/genex-common.conf;
    include snippets/genex-frontend-headers.conf;

    include snippets/genex-frontend-files.conf;

    access_log /var/log/nginx/genextechnocrats.com-access.log;
    error_log  /var/log/nginx/genextechnocrats.com-error.log;
}
