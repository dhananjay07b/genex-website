# How both frontend sites serve the one built app (baked into the image at
# /usr/share/nginx/html). Included inside each frontend server block.

root /usr/share/nginx/html;
index index.html;

# Built JS/CSS: the file name changes whenever the content does, so browsers can keep
# them for a year. A missing file is a real 404, never index.html: an old tab asking
# for a file a deploy removed then reloads cleanly (frontend/src/lib/staleBuild.ts).
location /assets/ {
    expires 1y;
    try_files $uri =404;
}

# Images and other files from frontend/public keep their names across deploys, so a
# shorter cache. Missing ones are 404s too.
location ~ ^/(images|brand|data)/ {
    expires 7d;
    try_files $uri =404;
}

# Every other path is a page: serve the file if it exists (favicon, robots.txt…),
# otherwise index.html and let the app's router take over.
location / {
    try_files $uri /index.html;
}

# The app's entry page: always re-checked, so a deploy shows up immediately.
location = /index.html {
    expires -1;
}
